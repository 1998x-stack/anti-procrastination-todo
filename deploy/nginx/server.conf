# Start-First static site — nginx server block.
#
# Mounted read-only into the nginx container at /etc/nginx/conf.d/default.conf.
# The document root is a symlink (/srv/start-first/current) resolved by nginx
# per request, which lets deploy.sh switch releases atomically with `nginx -s reload`
# without recreating the container.
#
# Network exposure: the container is published ONLY on 127.0.0.1:${PORT}.
# There is intentionally no TLS listener here: see docs/deployment-linux.md.
# Plain HTTP on loopback is a secure context for IndexedDB/crypto.randomUUID,
# which is required for local verification. A public deployment MUST terminate
# HTTPS (with HSTS) in front of this server.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    root /srv/start-first/current;
    index index.html;
    autoindex off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Liveness probe used by deploy.sh / healthcheck.sh. Does not touch disk.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles or repository metadata, even if one is added later.
    location ~ /\. { deny all; }

    # The HTML entry point must always be revalidated (never served stale).
    location = /index.html {
        include /etc/nginx/conf.d/headers-html.conf;
    }

    # The app only ever renders text nodes; uploading is not a supported flow.
    # Reject bodies early instead of buffering them to disk.
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    # No client-side URL routing exists in this app, so a missing asset must
    # return a real 404 instead of a 200 HTML fallback (which would silently
    # become a wrong-MIME-type response for a mistyped or missing .js file).
    location / {
        include /etc/nginx/conf.d/headers.inc;
        try_files $uri $uri/ =404;
    }
}
